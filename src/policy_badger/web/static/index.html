<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Badger - Raymond</title>
  <link rel="stylesheet" href="/assets/css/badger.css">
  <script defer src="/assets/js/badger.js"></script>
</head>
<body class="policy-home">
  <div class="app" id="app">
    <main class="canvas" id="canvas">
      <header class="topbar">
        <button type="button" class="rail-toggle icon-btn on-light" id="rail-toggle" aria-label="Open navigation" aria-controls="rail" aria-expanded="false"></button>
        <div class="wordmark grow">Policy Badger<span class="sub">Raymond</span></div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-lime" id="new-question-btn"><span data-icon="sparkle" aria-hidden="true"></span>New Question</button>
          <a class="btn btn-dark" href="/settings"><span data-icon="settings" aria-hidden="true"></span>Settings</a>
        </div>
      </header>

      <section class="hero scroll-y" id="home" aria-labelledby="hero-title">
        <div class="hero-mark" id="hero-mark" aria-hidden="true"></div>
        <h1 id="hero-title">How can we help you <em>today</em>?</h1>
        <p class="lede">Find clarity in your company’s published policies. Ask a question and Policy Badger will search them for an answer, using only what those policies say.</p>
        <div class="starters">
          <button type="button" class="starter" data-question="What is the deadline for submitting timesheets?">
            <span class="starter-top"><span class="starter-title">Timesheets &amp; Time Tracking</span><span class="starter-go" data-icon="arrowUpRight" aria-hidden="true"></span></span>
            <span class="starter-desc">Deadlines, daily entries, and how to charge billable vs. overhead time.</span>
          </button>
          <button type="button" class="starter" data-question="How do I submit an expense report?">
            <span class="starter-top"><span class="starter-title">Expenses &amp; Reimbursement</span><span class="starter-go" data-icon="arrowUpRight" aria-hidden="true"></span></span>
            <span class="starter-desc">Categories, receipts, approval limits, and how to submit a claim.</span>
          </button>
          <button type="button" class="starter" data-question="How do I request paid time off?">
            <span class="starter-top"><span class="starter-title">Time Off &amp; Holidays</span><span class="starter-go" data-icon="arrowUpRight" aria-hidden="true"></span></span>
            <span class="starter-desc">PTO accrual, requests, unscheduled absences, and the holiday schedule.</span>
          </button>
          <button type="button" class="starter" data-question="Do I need approval for professional development?">
            <span class="starter-top"><span class="starter-title">Approvals &amp; Training</span><span class="starter-go" data-icon="arrowUpRight" aria-hidden="true"></span></span>
            <span class="starter-desc">Who signs off on what, and the rules for professional development.</span>
          </button>
        </div>
      </section>

      <section class="thread scroll-y hidden" id="chat" aria-label="Policy conversation" tabindex="0">
        <div class="thread-inner" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <div class="composer-mark" id="composer-mark" aria-hidden="true"></div>
          <textarea id="question" rows="1" placeholder="Ask about any company policy…" maxlength="1000" aria-label="Your policy question" aria-describedby="composer-hint"></textarea>
          <div class="composer-tools">
            <button type="button" class="icon-btn on-light hidden" id="mic" aria-label="Dictate a question" aria-pressed="false"></button>
            <button type="submit" class="composer-send" id="send" aria-label="Send question" disabled></button>
          </div>
        </form>
        <p class="composer-hint" id="composer-hint">Enter to send · Shift+Enter for a new line</p>
      </div>
    </main>
  </div>
  <noscript><p class="alert alert-info">Please enable JavaScript to ask Policy Badger a question.</p></noscript>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      'use strict';
      const B = window.Badger;
      const icons = B.Icons;
      const input = B.el('question');
      const send = B.el('send');
      const chat = B.el('chat');
      const messages = B.el('messages');
      const home = B.el('home');
      const toggle = B.el('rail-toggle');
      const mic = B.el('mic');
      const SPINES = ['var(--mint)', 'var(--amber)', 'var(--rose)', 'var(--lime)', 'var(--sky)'];
      const headers = new Set(['Direct Answer', 'Key Details', 'Important Notes / Exceptions', 'What You Should Do']);
      // Folders are the real policy topics in the database, not fixed labels.
      let folders = [];
      try {
        const topicData = await B.api('/api/topics');
        folders = (topicData.topics || []).slice(0, 6).map((label, i) => ({
          label, spine: SPINES[i % SPINES.length], question: 'What is the policy on ' + label + '?'
        }));
      } catch (e) { folders = []; }

      // Threads mirror server-side conversations; `id` is a conversation UUID.
      let threads = [];
      let currentConversationId = null;
      let sequence = 0;
      let pending = null;
      let recognition = null;
      let listening = false;
      const canSpeak = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);

      document.querySelectorAll('[data-icon]').forEach(node => {
        node.innerHTML = icons[node.dataset.icon](16);
      });
      B.el('hero-mark').innerHTML = B.mark(52);
      B.el('composer-mark').innerHTML = B.mark(19);
      toggle.innerHTML = icons.menu(19);
      send.innerHTML = icons.arrowRight(19);
      mic.innerHTML = icons.mic(18);
      B.autoGrow(input);

      // Resolve the existing session before rendering role-dependent navigation.
      const user = await B.me();
      const nameParts = String(user && user.username || '').trim().split(/[\s._@-]+/).filter(Boolean);
      const initials = nameParts.length > 1
        ? (Array.from(nameParts[0])[0] + Array.from(nameParts[1])[0]).toUpperCase()
        : Array.from(nameParts[0] || 'You').slice(0, 2).join('').toUpperCase();
      const railOptions = { active: 'home', user, folders, threads,
        footer: 'Answers come only from your company’s published policies.' };
      B.el('app').insertAdjacentHTML('afterbegin', B.renderRail(railOptions));
      const rail = B.el('rail');
      rail.setAttribute('aria-label', 'Main navigation');
      // These shared decorative affordances have no actions on this page.
      rail.querySelectorAll('.grp-actions, .row-more').forEach(node => node.remove());
      const logout = document.createElement('a');
      logout.className = 'rail-item';
      logout.href = '/logout';
      logout.innerHTML = icons.logout(17) + '<span>Log Out</span>';
      rail.querySelector('.rail-foot').before(logout);
      const railClose = B.el('rail-menu');
      railClose.classList.add('rail-toggle');
      railClose.setAttribute('aria-label', 'Close navigation');
      railClose.innerHTML = icons.x(17);
      railClose.addEventListener('click', () => closeRail(true));
      B.bindRail();

      const mobile = window.matchMedia('(max-width: 820px)');
      function syncRail() {
        const open = rail.classList.contains('open');
        rail.inert = mobile.matches && !open;
        B.el('canvas').inert = mobile.matches && open;
        toggle.setAttribute('aria-expanded', String(open));
      }
      function closeRail(restoreFocus = false) {
        rail.classList.remove('open');
        syncRail();
        if (restoreFocus) toggle.focus();
      }
      toggle.addEventListener('click', () => {
        syncRail();
        if (rail.classList.contains('open')) railClose.focus();
      });
      mobile.addEventListener('change', syncRail);
      syncRail();
      document.addEventListener('keydown', event => {
        if (!mobile.matches || !rail.classList.contains('open')) return;
        if (event.key === 'Escape') closeRail(true);
        if (event.key === 'Tab') {
          const focusable = Array.from(rail.querySelectorAll('a, button, [tabindex="0"]'))
            .filter(node => node.getClientRects().length && !node.disabled);
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault(); last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault(); first.focus();
          }
        }
      });
      rail.querySelectorAll('.rail-group').forEach(group => {
        const body = rail.querySelector('[data-for="' + group.dataset.group + '"]');
        body.id = body.id || 'rail-' + group.dataset.group;
        group.tabIndex = 0;
        group.setAttribute('role', 'button');
        group.setAttribute('aria-controls', body.id);
        group.setAttribute('aria-expanded', 'true');
        group.addEventListener('click', () => group.setAttribute('aria-expanded', String(!body.classList.contains('hidden'))));
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault(); group.click();
          }
        });
      });

      // ── Conversation history ────────────────────────────────────────────
      function groupFor(iso) {
        const when = new Date(iso);
        if (Number.isNaN(when.getTime())) return 'Earlier';
        const startOfToday = new Date();
        startOfToday.setHours(0, 0, 0, 0);
        const days = Math.floor((startOfToday - when) / 86400000);
        if (days <= 0) return 'Today';
        if (days === 1) return 'Yesterday';
        if (days < 7) return 'This week';
        return 'Earlier';
      }

      async function refreshConversations() {
        try {
          const data = await B.api('/api/conversations');
          threads = (data.conversations || []).map(c => ({
            id: c.id,
            label: c.title,
            group: groupFor(c.updated_at),
            active: c.id === currentConversationId
          }));
          updateThreads();
        } catch (e) { /* the rail simply stays as it is */ }
      }

      async function openConversation(conversationId) {
        if (pending) pending.abort();
        pending = null;
        let data;
        try {
          data = await B.api('/api/conversations/' + encodeURIComponent(conversationId));
        } catch (e) {
          B.toast(e.message || 'Could not open that conversation.', 'error');
          return;
        }
        currentConversationId = conversationId;
        messages.replaceChildren();
        home.classList.add('hidden');
        chat.classList.remove('hidden');
        for (const message of (data.messages || [])) {
          if (message.role === 'user') appendUser(message.content);
          else appendBot(message.content, message.rows_found, lastQuestion(data.messages, message));
        }
        updateThreads();
        scrollDown();
      }

      // The question a given answer replied to, so Regenerate still works on
      // a transcript loaded from the server.
      function lastQuestion(all, answer) {
        const index = all.indexOf(answer);
        for (let i = index - 1; i >= 0; i -= 1) {
          if (all[i].role === 'user') return all[i].content;
        }
        return '';
      }

      // Refresh only the list, so mobile and collapse handlers are bound once.
      function updateThreads() {
        const template = document.createElement('template');
        template.innerHTML = B.renderRail({ ...railOptions, threads });
        const list = template.content.querySelector('#rail-threads');
        list.querySelectorAll('.row-more').forEach(node => {
          node.setAttribute('aria-label', 'Delete conversation');
          node.title = 'Delete conversation';
        });
        B.el('rail-threads').replaceChildren(...list.childNodes);
      }
      B.el('rail-threads').addEventListener('click', async event => {
        const button = event.target.closest('[data-thread]');
        if (!button) return;
        const conversationId = button.dataset.thread;

        if (event.target.closest('.row-more')) {
          event.stopPropagation();
          try {
            await B.api('/api/conversations/' + encodeURIComponent(conversationId), { method: 'DELETE' });
            if (conversationId === currentConversationId) resetChat();
            await refreshConversations();
            B.toast('Conversation deleted.');
          } catch (e) {
            B.toast(e.message || 'Could not delete that conversation.', 'error');
          }
          return;
        }

        closeRail();
        openConversation(conversationId);
      });
      rail.querySelectorAll('.rail-folder').forEach((folder, index) => {
        folder.addEventListener('click', event => {
          event.preventDefault();
          const entry = folders[index];
          if (!entry) return;
          input.value = entry.question;
          input.dispatchEvent(new Event('input'));
          closeRail(); input.focus();
        });
      });
      rail.querySelector('a[href="/"]').addEventListener('click', event => {
        event.preventDefault(); resetChat();
      });
      rail.querySelector('a[href="/#chats"]').addEventListener('click', event => {
        event.preventDefault(); closeRail();
        if (threads.length) { chat.focus(); scrollDown(); }
        else input.focus();
      });
      B.el('rail-search-btn').addEventListener('click', () => { closeRail(); input.focus(); });
      B.el('new-chat-btn').addEventListener('click', resetChat);
      B.el('new-question-btn').addEventListener('click', resetChat);

      function updateSend() {
        send.disabled = !!pending || !input.value.trim();
        messages.querySelectorAll('[data-action="regenerate"]').forEach(button => { button.disabled = !!pending; });
      }
      function resetChat() {
        if (pending) pending.abort();
        pending = null;
        if (recognition && listening) recognition.abort();
        if (canSpeak) window.speechSynthesis.cancel();
        messages.replaceChildren();
        currentConversationId = null;
        updateThreads();
        home.classList.remove('hidden');
        chat.classList.add('hidden');
        input.value = '';
        input.dispatchEvent(new Event('input'));
        closeRail(); input.focus();
      }
      function scrollDown() { chat.scrollTop = chat.scrollHeight; }

      // Escape the entire answer before adding our small, fixed set of tags.
      function renderAnswer(text) {
        const lines = B.escHtml(text).split(/\r?\n/);
        let html = '';
        let inList = false;
        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (line.startsWith('- ')) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += '<li>' + line.slice(2) + '</li>';
          } else {
            if (inList) { html += '</ul>'; inList = false; }
            if (headers.has(line)) html += '<h4>' + line + '</h4>';
            else if (line) html += '<p>' + line + '</p>';
          }
        }
        return html + (inList ? '</ul>' : '');
      }
      function actionButton(action, label, icon) {
        return '<button type="button" class="msg-action" data-action="' + action + '" aria-label="' + label + '" title="' + label + '">' + icon(15) + '</button>';
      }
      function appendUser(question) {
        const row = document.createElement('article');
        row.className = 'msg from-user';
        row.id = 'question-' + (++sequence);
        row.tabIndex = -1;
        row.setAttribute('aria-label', 'Your question');
        row.innerHTML = '<div class="msg-avatar user" aria-hidden="true">' + B.escHtml(initials) + '</div>' +
          '<div class="msg-col"><div class="bubble">' + B.escHtml(question).replace(/\n/g, '<br>') + '</div></div>';
        messages.appendChild(row);
        scrollDown();
      }
      function appendBot(answer, rowsFound, question, isError = false) {
        const row = document.createElement('article');
        row.className = 'msg from-bot' + (isError ? ' is-error' : '');
        row.setAttribute('aria-label', isError ? 'Policy Badger error' : 'Policy Badger answer');
        row.innerHTML = '<div class="msg-avatar bot" aria-hidden="true">' + B.mark(15) + '</div>' +
          '<div class="msg-col"><div class="bubble">' + renderAnswer(answer) + '</div>' +
          '<div class="msg-meta wrap"><span>' + B.escHtml(B.timeNow()) + '</span>' +
          (isError ? '' : '<span aria-hidden="true">' + icons.checkDouble(14) + '</span><span class="chip-count">' + B.escHtml(rowsFound) + ' policy records matched</span>') + '</div>' +
          '<div class="msg-actions">' + actionButton('regenerate', 'Regenerate answer', icons.refresh) +
          (canSpeak ? actionButton('speak', 'Read answer aloud', icons.speaker) : '') +
          actionButton('copy', 'Copy answer', icons.copy) + actionButton('feedback', 'Mark answer unhelpful', icons.thumbDown) + '</div></div>';
        row.querySelector('[data-action="regenerate"]').addEventListener('click', () => ask(question));
        const speak = row.querySelector('[data-action="speak"]');
        if (speak) speak.addEventListener('click', () => {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(answer));
        });
        row.querySelector('[data-action="copy"]').addEventListener('click', async event => {
          const button = event.currentTarget;
          try {
            await navigator.clipboard.writeText(answer);
            button.innerHTML = icons.check(15);
            button.classList.add('done');
            button.setAttribute('aria-label', 'Answer copied');
            setTimeout(() => {
              button.innerHTML = icons.copy(15);
              button.classList.remove('done');
              button.setAttribute('aria-label', 'Copy answer');
            }, 1600);
          } catch { B.toast('Could not copy. Please select and copy the answer text.', 'error'); }
        });
        row.querySelector('[data-action="feedback"]').addEventListener('click', () => B.toast('Thanks — feedback noted.'));
        messages.appendChild(row);
        scrollDown();
      }
      async function ask(text) {
        const question = text.trim();
        if (!question || pending) return;
        if (recognition && listening) recognition.abort();
        const request = new AbortController();
        pending = request;
        home.classList.add('hidden');
        chat.classList.remove('hidden');
        appendUser(question);
        input.value = '';
        input.dispatchEvent(new Event('input'));
        input.focus();
        const typing = document.createElement('div');
        typing.className = 'msg from-bot';
        typing.innerHTML = '<div class="msg-avatar bot" aria-hidden="true">' + B.mark(15) + '</div>' +
          '<div class="typing" role="status" aria-label="Searching published policies"><i></i><i></i><i></i></div>';
        messages.appendChild(typing);
        scrollDown();
        try {
          const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, conversation_id: currentConversationId }),
            signal: request.signal
          });
          const data = await response.json();
          if (pending !== request) return;
          typing.remove();
          if (!response.ok || data.error) {
            appendBot('Sorry, I couldn’t answer that question. ' + (data.error || 'Please try again in a moment.'), null, question, true);
          } else if (typeof data.answer !== 'string' || !Number.isInteger(data.rows_found)) {
            throw new Error('Invalid answer response');
          } else {
            appendBot(data.answer, data.rows_found, question);
            if (data.conversation_id) currentConversationId = data.conversation_id;
            // Pick up the server-derived title and ordering.
            refreshConversations();
          }
        } catch (error) {
          if (pending !== request || error.name === 'AbortError') return;
          typing.remove();
          appendBot('Sorry, I couldn’t reach the policy service. Please try again in a moment.', null, question, true);
        } finally {
          typing.remove();
          if (pending === request) { pending = null; updateSend(); }
        }
      }
      input.addEventListener('input', updateSend);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault(); ask(input.value);
        }
      });
      B.el('composer').addEventListener('submit', event => { event.preventDefault(); ask(input.value); });
      document.querySelectorAll('.starter').forEach(button => {
        button.addEventListener('click', () => ask(button.dataset.question));
      });
      if (window.webkitSpeechRecognition) {
        recognition = new window.webkitSpeechRecognition();
        recognition.lang = document.documentElement.lang;
        recognition.interimResults = false;
        mic.classList.remove('hidden');
        recognition.onstart = () => {
          listening = true;
          mic.setAttribute('aria-pressed', 'true');
          mic.setAttribute('aria-label', 'Stop dictation');
          B.toast('Listening — ask your policy question.');
        };
        recognition.onend = () => {
          listening = false;
          mic.setAttribute('aria-pressed', 'false');
          mic.setAttribute('aria-label', 'Dictate a question');
        };
        recognition.onresult = event => {
          input.value = (input.value + (input.value ? ' ' : '') + event.results[0][0].transcript).slice(0, input.maxLength);
          input.dispatchEvent(new Event('input'));
          input.focus();
        };
        recognition.onerror = event => {
          if (event.error !== 'aborted') B.toast('Dictation is unavailable. Please type your question instead.', 'error');
        };
        mic.addEventListener('click', () => {
          try { if (listening) recognition.stop(); else recognition.start(); }
          catch { B.toast('Dictation could not start. Please try again.', 'error'); }
        });
      }
      // Replace the built-in starters with the user's saved questions.
      try {
        const settingsData = await B.api('/api/settings');
        const saved = (settingsData.settings && settingsData.settings.prompts) || [];
        const buttons = [...document.querySelectorAll('.starter')];
        buttons.forEach((button, i) => {
          if (saved[i]) {
            button.dataset.question = saved[i];
            button.querySelector('.starter-title').textContent = saved[i];
            const desc = button.querySelector('.starter-desc');
            if (desc) desc.remove();
          } else if (i >= saved.length && saved.length) {
            button.remove();
          }
        });
      } catch (e) { /* the default starters stay */ }

      await refreshConversations();
      updateSend();
    });
  </script>
</body>
</html>
