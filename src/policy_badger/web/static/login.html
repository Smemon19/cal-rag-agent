<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Policy Badger - Raymond</title>
  <link rel="stylesheet" href="/assets/css/badger.css">
  <script defer src="/assets/js/badger.js"></script>
</head>
<body>
  <main class="auth">
    <section class="auth-card" aria-labelledby="sign-in-title">
      <div class="auth-brand">
        <span class="mark" id="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Policy Badger</h1>
          <p class="sub">Raymond</p>
        </div>
      </div>
      <h2 id="sign-in-title">Sign in</h2>
      <p class="lede">Enter your credentials to continue.</p>
      <div role="alert"><!--ERROR--></div>
      <form method="POST" action="/login">
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="password-field">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
            <button class="icon-btn on-light password-toggle hidden" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false"></button>
          </div>
        </div>
        <button class="btn btn-violet btn-block" type="submit">Sign in</button>
      </form>
      <div class="auth-foot">Policy Badger - Raymond</div>
    </section>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('brand-mark').innerHTML = Badger.mark(22);
      const password = document.getElementById('password');
      const toggle = document.querySelector('.password-toggle');
      toggle.innerHTML = Badger.Icons.eye(18);
      toggle.classList.remove('hidden');
      toggle.addEventListener('click', function () {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.setAttribute('aria-pressed', String(show));
      });
    });
  </script>
</body>
</html>
