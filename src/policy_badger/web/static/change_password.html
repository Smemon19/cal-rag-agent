<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — Policy Badger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0f1729;
      --accent:  #4f8ef7;
      --border:  #e4e8f0;
      --text:    #1c2333;
      --muted:   #8892a4;
      --surface: #f7f8fc;
      --error:   #c0392b;
      --success: #16a34a;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--surface);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #4f8ef7 0%, #7c5be6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
    }

    .logo-text p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .notice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .field-wrap {
      position: relative;
      margin-bottom: 6px;
    }

    .field-wrap input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 42px 11px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      color: var(--text);
      background: var(--surface);
    }

    .field-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
      background: #fff;
    }

    .field-wrap input.input-error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(192,57,43,0.08);
    }

    .field-wrap input.input-success {
      border-color: var(--success);
      box-shadow: 0 0 0 3px rgba(22,163,74,0.08);
    }

    .toggle-eye {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .toggle-eye:hover { color: var(--text); }

    .form-group {
      margin-bottom: 18px;
    }

    /* Strength bar */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      height: 4px;
    }

    .strength-bar span {
      flex: 1;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.25s;
    }

    .strength-label {
      font-size: 11.5px;
      margin-top: 5px;
      height: 16px;
      color: var(--muted);
      transition: color 0.25s;
    }

    /* Match hint */
    .match-hint {
      font-size: 12px;
      margin-top: 5px;
      height: 16px;
      transition: color 0.2s;
    }

    .match-hint.ok   { color: var(--success); }
    .match-hint.bad  { color: var(--error); }

    .error-box {
      background: #fff1f1;
      color: var(--error);
      border: 1px solid #ffd5d5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    button[type="submit"] {
      width: 100%;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 6px;
    }

    button[type="submit"]:hover   { background: #1a2540; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; background: var(--navy); }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .footer-link a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-link a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <div class="logo-icon">🦡</div>
      <div class="logo-text">
        <h1>Policy Badger</h1>
        <p>Company Policy Assistant</p>
      </div>
    </div>

    <div class="notice">
      🔒 For your security, you must set a personal password before continuing.
    </div>

    <h2>Set your password</h2>
    <p class="subtitle">Enter your temporary password, then choose a new one.</p>

    <!--ERROR-->

    <form method="POST" action="/change-password" id="change-form" novalidate>

      <div class="form-group">
        <label for="current_password">Temporary Password</label>
        <div class="field-wrap">
          <input type="password" id="current_password" name="current_password" placeholder="Your temporary password" required autocomplete="current-password" />
          <button type="button" class="toggle-eye" onclick="toggleVisibility('current_password', this)" aria-label="Show password">
            <svg id="eye-current_password" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="field-wrap">
          <input type="password" id="new_password" name="new_password" placeholder="Choose a strong password" required autocomplete="new-password" oninput="checkStrength(this.value); checkMatch()" />
          <button type="button" class="toggle-eye" onclick="toggleVisibility('new_password', this)" aria-label="Show password">
            <svg id="eye-new_password" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar">
          <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="field-wrap">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required autocomplete="new-password" oninput="checkMatch()" />
          <button type="button" class="toggle-eye" onclick="toggleVisibility('confirm_password', this)" aria-label="Show password">
            <svg id="eye-confirm_password" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="match-hint" id="match-hint"></div>
      </div>

      <button type="submit" id="submit-btn">Set Password</button>
    </form>

    <div class="footer-link">
      <a href="/logout">Log out instead</a>
    </div>

  </div>

  <script>
    const segments = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
    const strengthLabel = document.getElementById('strength-label');
    const matchHint = document.getElementById('match-hint');
    const submitBtn = document.getElementById('submit-btn');

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
    const labels = ['Weak', 'Fair', 'Good', 'Strong'];

    function scorePassword(pw) {
      if (pw.length === 0) return 0;
      let score = 0;
      if (pw.length >= 8)  score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      return Math.min(score, 4);
    }

    function checkStrength(pw) {
      const score = scorePassword(pw);
      segments.forEach((seg, i) => {
        seg.style.background = i < score ? colors[score - 1] : 'var(--border)';
      });
      strengthLabel.textContent = pw.length === 0 ? '' : labels[score - 1] || 'Weak';
      strengthLabel.style.color = pw.length === 0 ? 'var(--muted)' : colors[score - 1];
    }

    function checkMatch() {
      const np = document.getElementById('new_password').value;
      const cp = document.getElementById('confirm_password').value;
      const confirmInput = document.getElementById('confirm_password');

      if (cp.length === 0) {
        matchHint.textContent = '';
        matchHint.className = 'match-hint';
        confirmInput.classList.remove('input-success', 'input-error');
        return;
      }

      if (np === cp) {
        matchHint.textContent = '✓ Passwords match';
        matchHint.className = 'match-hint ok';
        confirmInput.classList.add('input-success');
        confirmInput.classList.remove('input-error');
      } else {
        matchHint.textContent = 'Passwords do not match';
        matchHint.className = 'match-hint bad';
        confirmInput.classList.add('input-error');
        confirmInput.classList.remove('input-success');
      }
    }

    function toggleVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      const svg = btn.querySelector('svg');
      svg.innerHTML = isHidden
        ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    document.getElementById('change-form').addEventListener('submit', function(e) {
      const np = document.getElementById('new_password').value;
      const cp = document.getElementById('confirm_password').value;
      const curr = document.getElementById('current_password').value;

      if (!curr) { e.preventDefault(); return; }

      if (np !== cp) {
        e.preventDefault();
        matchHint.textContent = 'Passwords do not match';
        matchHint.className = 'match-hint bad';
        document.getElementById('confirm_password').classList.add('input-error');
        return;
      }

      if (np.length < 8) {
        e.preventDefault();
        document.getElementById('new_password').focus();
        strengthLabel.textContent = 'Must be at least 8 characters';
        strengthLabel.style.color = '#ef4444';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';
    });
  </script>
</body>
</html>
